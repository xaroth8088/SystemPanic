name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      ref:
        description: Exact ref to validate when called by the release workflow
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned verification tools
        run: 'python -m pip install --only-binary=:all: --requirement requirements-ci.txt'
      - name: Run ordinary regressions
        run: python tools/test.py
      - name: Capture bounded solo and UI verification
        run: python tools/verify.py --levels 3 --seconds 120
      - name: Retain reports and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-${{ matrix.os }}
          path: |
            output/tests/**
            output/verification/**
          if-no-files-found: warn
          retention-days: 7
