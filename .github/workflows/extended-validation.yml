name: Extended validation

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact ref to validate when called by the release workflow
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gameplay-matrix:
    name: Exhaustive gameplay combinations
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned verification tools
        run: 'python -m pip install --only-binary=:all: --requirement requirements-ci.txt'
      - name: Run every gameplay combination in disjoint partitions
        run: python tools/verify_matrix.py --workers 4 --output output/extended/gameplay-matrix.json
      - name: Exercise longer remixes, swaps and all presentation pairs
        run: python tools/verify_living.py --mode mixes --output output/extended/remixes
      - name: Retain full coverage report and worker logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: exhaustive-gameplay-matrix
          path: output/extended/**
          if-no-files-found: warn
          retention-days: 7
